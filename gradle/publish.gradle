java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    repositories {
        maven {
            // Stage artifacts locally; JReleaser deploys them to the Central Portal
            // (OSSRH / oss.sonatype.org was sunset on 2025-06-30).
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Couchmove'
                packaging = 'jar'
                description = 'Couchbase data migration tool for Java'
                url = 'https://github.com/differentway/couchmove'

                scm {
                    connection = 'scm:git:git@github.com:differentway/couchmove.git'
                    developerConnection = 'scm:git:git@github.com:differentway/couchmove.git'
                    url = 'git@github.com:differentway/couchmove.git'
                }

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'tchlyah'
                        name = 'Tayeb Chlyah'
                        email = 'tayebchlyah@gmail.com'
                    }
                }
            }
        }
    }
}

signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    // Only sign when a key is provided (e.g. CI). Snapshots are published unsigned.
    required = { signingKey != null && !version.toString().endsWith("SNAPSHOT") }
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}
